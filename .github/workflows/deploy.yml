name: Deploy to VPS

# Deploys main only after the Test workflow passed on that commit (or by hand). Every green main
# commit deploys, whichever app or package it touched.
on:
  workflow_run:
    workflows: [Test]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  build:
    name: Build
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build production apps
        env:
          NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
        run: pnpm build

      - name: Verify build artifacts
        run: |
          test -f apps/api/dist/index.js
          test -d apps/web/.next

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: motake-build
          if-no-files-found: error
          include-hidden-files: true
          path: |
            apps/api/dist
            apps/web/.next
            apps/web/public

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: motake-build
          path: _artifact

      - name: Place build artifacts in workspace
        run: |
          mkdir -p apps/api apps/web
          cp -a _artifact/api/dist apps/api/
          cp -a _artifact/web/.next apps/web/
          cp -a _artifact/web/public apps/web/
          rm -rf _artifact
          test -f apps/api/dist/index.js
          test -d apps/web/.next

      - name: Deploy to VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_APP_PATH: ${{ secrets.VPS_APP_PATH }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          PORT: ${{ vars.MOTAKE_API_PORT || '8000' }}
          NODE_ENV: production
          LOGGER_LEVEL: ${{ vars.LOGGER_LEVEL || 'error' }}
          BASE_URL: ${{ secrets.BASE_URL }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
          R2_PUBLIC_BASE_URL: ${{ secrets.R2_PUBLIC_BASE_URL }}
          R2_DOCUMENTS_BUCKET_NAME: ${{ secrets.R2_DOCUMENTS_BUCKET_NAME }}
          NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          CORS_ALLOWED_ORIGIN: ${{ secrets.CORS_ALLOWED_ORIGIN }}
          MOTAKE_ROUTING_MODE: ${{ vars.MOTAKE_ROUTING_MODE || 'separate' }}
          MOTAKE_FRONTEND_DOMAIN: ${{ vars.MOTAKE_FRONTEND_DOMAIN }}
          MOTAKE_API_DOMAIN: ${{ vars.MOTAKE_API_DOMAIN }}
          MOTAKE_FRONTEND_PORT: ${{ vars.MOTAKE_WEB_PORT || '3000' }}
          MOTAKE_API_PORT: ${{ vars.MOTAKE_API_PORT || '8000' }}
          MOTAKE_NOTIFICATION_PORT: ${{ vars.MOTAKE_NOTIFICATION_PORT || '8100' }}
          NOTIFICATION_INTERNAL_API_KEY: ${{ secrets.NOTIFICATION_INTERNAL_API_KEY }}
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
          META_PHONE_NUMBER_ID: ${{ secrets.META_PHONE_NUMBER_ID }}
          META_APP_SECRET: ${{ secrets.META_APP_SECRET }}
          META_WEBHOOK_VERIFY_TOKEN: ${{ secrets.META_WEBHOOK_VERIFY_TOKEN }}
          INNGEST_EVENT_KEY: ${{ secrets.INNGEST_EVENT_KEY }}
          INNGEST_SIGNING_KEY: ${{ secrets.INNGEST_SIGNING_KEY }}
          NOTIFICATION_R2_ACCOUNT_ID: ${{ secrets.NOTIFICATION_R2_ACCOUNT_ID }}
          NOTIFICATION_R2_ACCESS_KEY_ID: ${{ secrets.NOTIFICATION_R2_ACCESS_KEY_ID }}
          NOTIFICATION_R2_SECRET_ACCESS_KEY: ${{ secrets.NOTIFICATION_R2_SECRET_ACCESS_KEY }}
          MOTAKE_INSTALL_TARGET: system
        run: |
          chmod +x deploy/ci/sync-to-vps.sh
          ./deploy/ci/sync-to-vps.sh

      - name: Health check (public)
        env:
          FRONTEND_URL: https://${{ vars.MOTAKE_FRONTEND_DOMAIN }}
          API_URL: https://${{ vars.MOTAKE_API_DOMAIN }}
        run: |
          for attempt in $(seq 1 12); do
            if curl -sf --max-time 10 "${API_URL}/health" && curl -sfI --max-time 10 "${FRONTEND_URL}" >/dev/null; then
              curl -sfI --max-time 10 "${FRONTEND_URL}" | head -5
              exit 0
            fi
            echo "Health check attempt ${attempt} failed (TLS/DNS may still be settling), retrying in 15s..."
            sleep 15
          done
          echo "error: public health check did not pass after 3 minutes" >&2
          exit 1
