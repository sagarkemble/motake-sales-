name: Test

on:
  push:
  pull_request:

# Every run wipes the database at DATABASE_URL, so only one may run at a time.
concurrency:
  group: test-database
  cancel-in-progress: false

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    # DATABASE_URL is stored on the production environment, not as a repo secret.
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The suite truncates every app table at DATABASE_URL; after go-live this secret must not be production.
      - name: Run tests
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          ALLOW_DB_WIPE: "true"
        run: pnpm test
