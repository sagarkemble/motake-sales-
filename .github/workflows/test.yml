name: Test

on:
  push:
  pull_request:

# Every run wipes the test database (motake-testing, the root .env.testing), so only one may run at
# a time. Production is never reachable from here: this job only has the testing environment.
concurrency:
  group: test-database
  cancel-in-progress: false

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    # DATABASE_URL is the testing environment's secret (the .env.testing database), never production.
    environment: testing
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The suite truncates every app table at DATABASE_URL; the wipe guard refuses anything but a
      # test database.
      - name: Run tests
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          ALLOW_DB_WIPE: "true"
        run: pnpm test
